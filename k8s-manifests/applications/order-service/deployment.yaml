apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: 034333502865.dkr.ecr.us-east-1.amazonaws.com/ecommerce-ms-order-service:v1.0.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: DATABASE_URL
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: KAFKA_BOOTSTRAP_SERVERS
            - name: KAFKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: KAFKA_USERNAME
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: order-service-secret
                  key: KAFKA_PASSWORD
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: KAFKA_TOPIC
            - name: SERVICE_NAME
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: SERVICE_NAME
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: AWS_REGION
            - name: CARTS_TABLE
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: CARTS_TABLE
            - name: SESSIONS_TABLE
              valueFrom:
                configMapKeyRef:
                  name: order-service-config
                  key: SESSIONS_TABLE
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /health/startup
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 2

          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2

          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 2
